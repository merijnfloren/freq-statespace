[project]
name = "freq-statespace"
version = "0.1.2"
description = "Frequency-domain (non)linear state-space identification using JAX."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0"
license-files = ["LICEN[CS]E*"]
authors = [
  {name = "Merijn Floren", email = "merijn.floren@gmail.com"}
]
keywords = [
    "system-identification",
    "state-space-models",
    "subspace-identification",
    "frequency-domain",
    "best-linear-approximation",
    "nonlinear-benchmarks",
    "nonlinear-regression",
    "neural-networks",
    "optimization",
    "jax",
    "equinox",
    "optimistix",
    "optax"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]
dependencies = [
  "jax[cuda12]>=0.4.38,!=0.7.0,!=0.7.1",
  "jaxtyping>=0.2.24",
  "optimistix>=0.0.10",
  "equinox>=0.12.2",
  "optax>=0.2.5",
  "scipy>=1.10",
  "nonlinear_benchmarks",
]

[project.urls]
homepage = "https://github.com/merijnfloren/freq-statespace"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[tool.ruff]
extend-include = ["*.ipynb"]
exclude = ["dep"]

[tool.ruff.lint]
fixable = ["I001", "F401", "UP"]
select = ["E", "F", "I001", "UP", "D"]
ignore = ["D203", "D213", "D416"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501"]

[tool.ruff.lint.isort]
lines-after-imports = 2
order-by-type = true

[tool.uv.sources]
best-linear-approximation = { path = "../best-linear-approximation", editable = true }

[dependency-groups]
dev = [
    "best-linear-approximation",
    "control>=0.10.2",
    "h5py>=3.16.0",
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
    "pyqt6>=6.11.0",
    "slycot>=0.7.0",
]
